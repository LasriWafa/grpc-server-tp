syntax = "proto3";
option java_package = "ma.formations.grpc.stubs";

service CalculatorService {
  // Unary
  rpc sum(UnaryRequest) returns (UnaryResponse);
  // Server Streaming
  rpc getOperationStream(ServerStreamRequest) returns (stream ServerStreamResponse);
  // Client Streaming
  rpc performStream(stream ClientStreamRequest) returns (ClientStreamResponse);
  // Bidirectional Streaming
  rpc fullStream(stream BidirectionalStreamRequest) returns (stream BidirectionalStreamResponse);
}

// Unary
message UnaryRequest { double a = 1; double b = 2; }
message UnaryResponse { double a = 1; double b = 2; double result = 3; }

// Server Streaming
message ServerStreamRequest { double a = 1; double b = 2; }
message ServerStreamResponse { double a = 1; double b = 2; double result = 3; string type = 4; }

// Client Streaming
message ClientStreamRequest { double a = 1; }
message ClientStreamResponse { double result = 1; repeated double receivedData = 2; }

// Bidirectional Streaming
message BidirectionalStreamRequest { double a = 1; }
message BidirectionalStreamResponse { double result = 1; }
